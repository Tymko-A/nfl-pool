document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;text-transform:uppercase;color:rgba(255,255,255,0.68);margin-top:4px\">Weeks<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:30px;line-height:1\">17<\u002Fdiv>\n            <div style=\"font-size:10.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.68);margin-top:4px\">Games each<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:30px;line-height:1\">1<\u002Fdiv>\n            <div style=\"font-size:10.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.68);margin-top:4px\">Winner<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:7px;background:#b8491f\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 400px;min-width:0;display:grid;place-items:center;padding:44px 24px\">\n      <div style=\"width:min(388px,100%)\">\n        <sc-if value=\"{{ showQuick }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border-radius:18px;padding:26px;box-shadow:0 1px 2px rgba(27,26,24,0.04), 0 12px 32px rgba(27,26,24,0.08);text-align:center\">\n            <div style=\"width:64px;height:64px;border-radius:999px;background:#1f5c3c;color:#fff;display:grid;place-items:center;font-family:Archivo,sans-serif;font-weight:800;font-size:26px;margin:0 auto 14px\">{{ savedInitial }}<\u002Fdiv>\n            <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.025em;line-height:1.1\">{{ savedName }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#6f6860;margin:6px 0 20px\">Recognised on this device. Welcome back.<\u002Fdiv>\n            <button style=\"width:100%;height:46px;border:0;border-radius:11px;background:#b8491f;color:#fff;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;box-shadow:0 4px 12px rgba(216,87,42,0.28)\" style-hover=\"background:#9c3f13\" sc-camel-on-click=\"{{ quickEnter }}\">Enter<\u002Fbutton>\n            <button style=\"margin-top:10px;width:100%;height:38px;border:1px solid #e2ded7;border-radius:10px;background:#fff;color:#56504a;font-size:13px;font-weight:600\" style-hover=\"background:#f7f5f2;color:#1b1a18\" sc-camel-on-click=\"{{ forgetMe }}\">Not {{ savedName }}? Sign in as someone else<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showGate }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:#fff;border-radius:18px;padding:24px;box-shadow:0 1px 2px rgba(27,26,24,0.04), 0 12px 32px rgba(27,26,24,0.08)\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em;margin-bottom:4px\">Who's this?<\u002Fdiv>\n          <div style=\"font-size:13px;color:#6f6860;line-height:1.5;margin-bottom:20px\">Pick your name and we'll remember you on this device. No password to lose.<\u002Fdiv>\n          <div style=\"margin-bottom:16px\">\n            <label style=\"display:block;font-size:12px;font-weight:600;color:#56504a;margin-bottom:6px\">Your name<\u002Flabel>\n            <sc-raw-select style=\"width:100%;height:44px;padding:0 12px;font-size:15px;color:#1b1a18;background:#faf9f7;border:1px solid #e2ded7;border-radius:11px\" value=\"{{ loginName }}\" sc-camel-on-change=\"{{ onLoginName }}\">\n              <option value=\"\">Select…<\u002Foption>\n              <sc-for list=\"{{ names }}\" as=\"n\" hint-placeholder-count=\"9\">\n                <option value=\"{{ n }}\">{{ n }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;color:#8f3c15;background:#fdeee6;border-radius:10px;padding:10px 12px;margin-bottom:14px\">{{ loginError }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button style=\"width:100%;height:46px;border:0;border-radius:11px;background:#b8491f;color:#fff;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;letter-spacing:-0.01em;box-shadow:0 4px 12px rgba(216,87,42,0.28)\" style-hover=\"background:#9c3f13\" sc-camel-on-click=\"{{ doLogin }}\">Enter the pool<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"font-size:12px;color:#726b63;line-height:1.55;margin-top:16px;text-align:center\">Nine names, no passwords. Your pick stays on this device, so next time it's one tap.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ authed }}\" hint-placeholder-val=\"{{ true }}\">\n\n  <div style=\"position:sticky;top:0;z-index:20;background:rgba(244,242,238,0.88);backdrop-filter:blur(12px);border-bottom:1px solid #e6e2db\">\n    <div style=\"max-width:1320px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n      <div style=\"width:36px;height:36px;border-radius:11px;background:#b8491f;color:#fff;display:grid;place-items:center;font-family:Archivo,sans-serif;font-weight:800;font-size:15px;flex:none\">TP<\u002Fdiv>\n      <div style=\"margin-right:auto\">\n        <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:17px;letter-spacing:-0.02em;line-height:1.15\">Trash Talk Pool<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#6f6860;font-weight:500\">Week {{ week }} · updated {{ updated }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e6e2db;border-radius:999px;padding:5px 6px 5px 12px\">\n          <span style=\"font-size:13px;font-weight:600\">{{ me }}<\u002Fspan>\n          <div style=\"width:26px;height:26px;border-radius:999px;background:#2f7a52;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700\">{{ meInitial }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button style=\"height:36px;padding:0 13px;border:1px solid #e2ded7;border-radius:10px;background:#fff;color:#56504a;font-size:13px;font-weight:600\" style-hover=\"background:#f7f5f2;color:#1b1a18\" sc-camel-on-click=\"{{ signOut }}\">Sign out<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1320px;margin:0 auto;padding:0 22px 12px;display:flex;gap:6px;overflow-x:auto\">\n      <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"8\">\n        <button style=\"{{ tab.style }}\" sc-camel-on-click=\"{{ tab.go }}\">{{ tab.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1320px;margin:0 auto;padding:22px 22px 0\">\n\n    <div ref=\"{{ stripRef }}\" style=\"display:flex;gap:10px;overflow-x:auto;padding-bottom:18px;scroll-behavior:smooth\">\n      <sc-for list=\"{{ strip }}\" as=\"s\" hint-placeholder-count=\"8\">\n        <div style=\"{{ s.cardStyle }}\">\n          <div style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#726b63;margin-bottom:7px\">{{ s.kicker }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:4px\">\n            <i style=\"{{ s.awayDot }}\"><\u002Fi>\n            <span style=\"font-family:Archivo,sans-serif;font-weight:600;font-size:14px\">{{ s.away }}<\u002Fspan>\n            <span style=\"font-size:10.5px;font-weight:500;color:#6f6860\">{{ s.awayOwner }}<\u002Fspan>\n            <span style=\"margin-left:auto;font-family:Archivo,sans-serif;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums\">{{ s.awayScore }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px\">\n            <i style=\"{{ s.homeDot }}\"><\u002Fi>\n            <span style=\"font-family:Archivo,sans-serif;font-weight:600;font-size:14px\">{{ s.home }}<\u002Fspan>\n            <span style=\"font-size:10.5px;font-weight:500;color:#6f6860\">{{ s.homeOwner }}<\u002Fspan>\n            <span style=\"margin-left:auto;font-family:Archivo,sans-serif;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums\">{{ s.homeScore }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isStandings }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px\">\n          <h1 style=\"margin:0;font-family:Archivo,sans-serif;font-weight:800;font-size:34px;letter-spacing:-0.03em\">Standings<\u002Fh1>\n          <button style=\"margin-left:auto;height:38px;padding:0 15px;border:1px solid #e2ded7;border-radius:10px;background:#fff;color:#56504a;font-size:13px;font-weight:600\" style-hover=\"background:#f7f5f2;color:#1b1a18\" sc-camel-on-click=\"{{ exportCsv }}\">Export CSV<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 20px;font-size:14px;color:#6f6860;max-width:640px;line-height:1.6\">Win = 1 point, tie = 0.5, loss or bye = 0. Ties broken on combined net points, then head-to-head, then points for.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:14px;margin-bottom:22px\">\n          <sc-for list=\"{{ podium }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"{{ p.cardStyle }}\">\n              <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n                <div style=\"{{ p.badgeStyle }}\">{{ p.rank }}<\u002Fdiv>\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#726b63\">{{ p.rankLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:32px;letter-spacing:-0.03em;line-height:1;margin-bottom:12px\">{{ p.name }}<\u002F gap:16px\">\n          <sc-for list=\"{{ schedule }}\" as=\"grp\" hint-placeholder-count=\"6\">\n            <div>\n              <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:9px\">\n                <span style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:17px;letter-spacing:-0.02em\">{{ grp.label }}<\u002Fspan>\n                <span style=\"font-size:12.5px;font-weight:700;color:#6f6860\">{{ grp.slot }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(27,26,24,0.05), 0 8px 24px rgba(27,26,24,0.05);overflow:hidden\">\n                <sc-for list=\"{{ grp.rows }}\" as=\"r\" hint-placeholder-count=\"7\">\n                  <div style=\"{{ r.rowStyle }}\">\n                    <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n                      <i style=\"{{ r.awayDot }}\"><\u002Fi>\n                      <span style=\"font-size:14.5px;font-weight:600;white-space:nowrap\">{{ r.awayName }}<\u002Fspan>\n                      <span style=\"font-size:11px;font-weight:500;color:#6f6860\">{{ r.awayOwner }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <span style=\"font-size:12px;color:#726b63;font-weight:700\">at<\u002Fspan>\n                    <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n                      <i style=\"{{ r.homeDot }}\"><\u002Fi>\n                      <span style=\"font-size:14.5px;font-weight:600;white-space:nowrap\">{{ r.homeName }}<\u002Fspan>\n                      <span style=\"font-size:11px;font-weight:500;color:#6f6860\">{{ r.homeOwner }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <span style=\"{{ r.stakeStyle }}\">{{ r.stake }}<\u002Fspan>\n                    <span style=\"{{ r.liveStyle }}\">{{ r.status }}<\u002Fspan>\n                    <span style=\"margin-left:auto;font-family:Archivo,sans-serif;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums\">{{ r.result }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isRosters }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <h1 style=\"margin:0 0 6px;font-family:Archivo,sans-serif;font-weight:800;font-size:34px;letter-spacing:-0.03em\">Rosters<\u002Fh1>\n        <p style=\"margin:0 0 22px;font-size:14px;color:#6f6860;max-width:640px;line-height:1.6\">Next year's draft order comes from this year's final standings — the champion picks first in one conference and last in the other. Send me the 2026 pick order and the board will appear here.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:14px\">\n          <sc-for list=\"{{ rosters }}\" as=\"p\" hint-placeholder-count=\"9\">\n            <div style=\"{{ p.cardStyle }}\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n                <div style=\"{{ p.badgeStyle }}\">{{ p.rank }}<\u002Fdiv>\n                <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:21px;letter-spacing:-0.02em\">{{ p.name }}<\u002Fdiv>\n                <div style=\"margin-left:auto;text-align:right\">\n                  <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums\">{{ p.pts }}<\u002Fdiv>\n                  <div style=\"font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#726b63\">points<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ p.teams }}\" as=\"tm\" hint-placeholder-count=\"2\">\n                <div style=\"border-top:1px solid #f1ede7;padding:11px 0 0;margin-bottom:10px\">\n                  <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\">\n                    <i style=\"{{ tm.dot }}\"><\u002Fi>\n                    <span style=\"font-size:10px;font-weight:700;letter-spacing:0.07em;color:#726b63\">{{ tm.conf }}<\u002Fspan>\n                    <span style=\"font-family:Archivo,sans-serif;font-weight:600;font-size:15px\">{{ tm.name }}<\u002Fspan>\n                    <span style=\"margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums\">{{ tm.rec }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:14px;font-size:11.5px;color:#6f6860;font-weight:500;padding-left:18px\">\n                    <span>PF {{ tm.pf }}<\u002Fspan><span>PA {{ tm.pa }}<\u002Fspan><span>Net {{ tm.net }}<\u002Fspan><span>{{ tm.streak }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isWeek }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <h1 style=\"margin:0 0 6px;font-family:Archivo,sans-serif;font-weight:800;font-size:34px;letter-spacing:-0.03em\">Week {{ week }}<\u002Fh1>\n        <p style=\"margin:0 0 22px;font-size:14px;color:#6f6860;line-height:1.6\">Sept 9–14, 2026. Only games involving a pool team are shown.<\u002Fp>\n        <h2 style=\"margin:0 0 12px;font-family:Archivo,sans-serif;font-weight:700;font-size:19px;letter-spacing:-0.02em\">Final<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(372px,1fr));gap:14px;margin-bottom:30px\">\n          <sc-for list=\"{{ finals }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div style=\"background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(27,26,24,0.05), 0 8px 24px rgba(27,26,24,0.05);overflow:hidden\">\n              <div style=\"display:flex;align-items:center;gap:9px;padding:11px 16px;background:#faf9f7;border-bottom:1px solid #f1ede7\">\n                <span style=\"font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#6f6860\">{{ g.slot }}<\u002Fspan>\n                <span style=\"{{ g.stakeStyle }}\">{{ g.stake }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:14px 16px\">\n                <sc-for list=\"{{ g.sides }}\" as=\"s\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;align-items:center;gap:11px;padding:7px 0\">\n                    <i style=\"{{ s.dot }}\"><\u002Fi>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:17px;letter-spacing:-0.02em;line-height:1.2\">{{ s.team }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#6f6860;font-weight:500\">{{ s.owner }} · {{ s.rec }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:30px;line-height:1;min-width:46px;text-align:right;font-variant-numeric:tabular-nums\">{{ s.score }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ g.hasDetail }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button style=\"margin-top:12px;height:34px;padding:0 13px;border:1px solid #e2ded7;border-radius:9px;background:#fff;color:#56504a;font-size:12.5px;font-weight:600\" style-hover=\"background:#f7f5f2;color:#1b1a18\" sc-camel-on-click=\"{{ g.toggle }}\">{{ g.toggleLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:14px;border-top:1px solid #f1ede7;padding-top:12px\">\n                    <div style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#726b63;margin-bottom:8px\">Game leaders<\u002Fdiv>\n                    <sc-for list=\"{{ g.leaders }}\" as=\"pl\" hint-placeholder-count=\"4\">\n                      <div style=\"display:flex;align-items:baseline;gap:10px;font-size:12.5px;padding:5px 0\">\n                        <span style=\"width:38px;flex:none;font-size:9.5px;font-weight:800;letter-spacing:0.06em;color:#9c3f13\">{{ pl.cat }}<\u002Fspan>\n                        <span style=\"font-weight:600\">{{ pl.who }}<\u002Fspan>\n                        <span style=\"margin-left:auto;text-align:right;color:#6f6860;font-variant-numeric:tabular-nums\">{{ pl.stat }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 4px;font-family:Archivo,sans-serif;font-weight:700;font-size:19px;letter-spacing:-0.02em\">Kickoff times<\u002Fh2>\n        <p style=\"margin:0 0 12px;font-size:13px;color:#6f6860\">{{ upcomingCount }} games still to play this week.<\u002Fp>\n        <div style=\"background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(27,26,24,0.05), 0 8px 24px rgba(27,26,24,0.05);overflow:hidden\">\n          <sc-for list=\"{{ slim }}\" as=\"u\" hint-placeholder-count=\"12\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid #f1ede7;flex-wrap:wrap\">\n              <div style=\"width:104px;flex:none\">\n                <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:13.5px\">{{ u.day }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6f6860;font-weight:600\">{{ u.time }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n                <i style=\"{{ u.awayDot }}\"><\u002Fi>\n                <span style=\"font-size:14px;font-weight:600;white-space:nowrap\">{{ u.away }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:12px;color:#726b63;font-weight:600\">at<\u002Fspan>\n              <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n                <i style=\"{{ u.homeDot }}\"><\u002Fi>\n                <span style=\"font-size:14px;font-weight:600;white-space:nowrap\">{{ u.home }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"{{ u.stakeStyle }}\">{{ u.stake }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isGrid }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <h1 style=\"margin:0 0 6px;font-family:Archivo,sans-serif;font-weight:800;font-size:34px;letter-spacing:-0.03em\">Week by week<\u002Fh1>\n        <p style=\"margin:0 0 16px;font-size:14px;color:#6f6860;max-width:660px;line-height:1.6\">Every pool team's season on one board, grouped by entrant in standings order. Cells fill in as the nightly feed lands each result.<\u002Fp>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:600;color:#7b736b;margin-bottom:18px\">\n          <span style=\"display:flex;align-items:center;gap:6px\"><i style=\"width:14px;height:14px;border-radius:4px;background:#2f7a52;display:block\"><\u002Fi>Win<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><i style=\"width:14px;height:14px;border-radius:4px;background:#e0dbd3;display:block\"><\u002Fi>Loss<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><i style=\"width:14px;height:14px;border-radius:4px;background:#f0b429;display:block\"><\u002Fi>Tie<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><i style=\"width:14px;height:14px;border-radius:4px;border:1.5px dashed #cfc7bd;display:block\"><\u002Fi>Scheduled<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(27,26,24,0.05), 0 8px 24px rgba(27,26,24,0.05);overflow-x:auto\">\n          <div style=\"min-width:840px\">\n            <div style=\"display:grid;grid-template-columns:224px repeat(18,1fr);gap:4px;font-size:10.5px;font-weight:700;color:#726b63;margin-bottom:6px\">\n              <div><\u002Fdiv>\n              <sc-for list=\"{{ weekNums }}\" as=\"wn\" hint-placeholder-count=\"18\">\n                <div style=\"text-align:center\">{{ wn }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ gridRows }}\" as=\"row\" hint-placeholder-count=\"18\">\n              <div style=\"display:grid;grid-template-columns:224px repeat(18,1fr);gap:4px;align-items:center;margin-bottom:4px\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding-right:12px\">\n                  <i style=\"{{ row.dot }}\"><\u002Fi>\n                  <span style=\"font-size:10.5px;font-weight:700;color:#726b63;width:46px;flex:none\">{{ row.owner }}<\u002Fspan>\n                  <span style=\"font-family:Archivo,sans-serif;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ row.team }}<\u002Fspan>\n                  <span style=\"margin-left:auto;font-size:11.5px;font-weight:700;flex:none;font-variant-numeric:tabular-nums\">{{ row.rec }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ row.cells }}\" as=\"c\" hint-placeholder-count=\"18\">\n                  <div style=\"{{ c.style }}\">{{ c.mark }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isH2H }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <h1 style=\"margin:0 0 6px;font-family:Archivo,sans-serif;font-weight:800;font-size:34px;letter-spacing:-0.03em\">Head-to-Head<\u002Fh1>\n        <p style=\"margin:0 0 22px;font-size:14px;color:#6f6860;max-width:660px;line-height:1.6\">Games where two pool teams meet. One entrant's gain is another's loss, so these swing the standings twice as hard.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:30px\">\n          <sc-for list=\"{{ collisions }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(27,26,24,0.05), 0 8px 24px rgba(27,26,24,0.05)\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n                <div style=\"flex:1\">\n                  <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:19px;letter-spacing:-0.02em;line-height:1.1\">{{ c.a }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:6px;margin-top:3px\"><i style=\"{{ c.aDot }}\"><\u002Fi><span style=\"font-size:11.5px;font-weight:600;color:#6f6860\">{{ c.aTeam }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:20px;color:#726b63;font-variant-numeric:tabular-nums\">{{ c.mid }}<\u002Fdiv>\n                <div style=\"flex:1;text-align:right\">\n                  <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:19px;letter-spacing:-0.02em;line-height:1.1\">{{ c.b }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:6px;margin-top:3px;justify-content:flex-end\"><span style=\"font-size:11.5px;font-weight:600;color:#6f6860\">{{ c.bTeam }}<\u002Fspan><i style=\"{{ c.bDot }}\"><\u002Fi><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-top:1px solid #f1ede7;padding-top:10px;font-size:11.5px;font-weight:600;color:#7b736b\">{{ c.status }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 4px;font-family:Archivo,sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em\">Season ledger<\u002Fh2>\n        <p style=\"margin:0 0 14px;font-size:13px;color:#6f6860\">Every pairing whose teams have met or are scheduled to meet. Net swing counts the winning margin toward whoever took the point.<\u002Fp>\n        <div style=\"background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(27,26,24,0.05), 0 8px 24px rgba(27,26,24,0.05);overflow:hidden\">\n          <div style=\"overflow-x:auto\">\n            <sc-raw-table style=\"width:100%;min-width:760px;font-size:14px\">\n              <sc-raw-thead>\n                <sc-raw-tr style=\"background:#faf9f7\">\n                  <sc-raw-th style=\"text-align:left;padding:13px 18px;font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#726b63\">Pairing<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"text-align:right;padding:13px 10px;font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#726b63\">Played<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"text-align:right;padding:13px 10px;font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#726b63\">Record<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"text-align:right;padding:13px 10px;font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#726b63\">Net swing<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"text-align:left;padding:13px 18px;font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#726b63\">Next meeting<\u002Fsc-raw-th>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ ledger }}\" as=\"row\" hint-placeholder-count=\"4\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"padding:13px 18px;border-top:1px solid #f1ede7;font-family:Archivo,sans-serif;font- 24px rgba(27,26,24,0.05)\";\n\nlet RECAP = {\n  week: \"Week 1\",\n  headline: \"Two games in and somebody's already insufferable\",\n  dek: \"Both openers were pool head-to-heads, which means four entrants have moved and five are still sitting on absolutely nothing. Ben leaves Thursday night twenty points to the good and Tymko leaves it twenty to the bad, and neither of them touched a football.\",\n  generated: \"Written Sept 11, 4:02 AM ET from the nightly feed\",\n\n  takeaways: [\n    \"Both opening games were pool head-to-heads — the schedule makers did us a favour and got straight to the good stuff.\",\n    \"Drake Maye threw three picks in Seattle and Adrian still only lost by three. He will call that encouraging. Nobody should let him.\",\n    \"Nineteen points of the twenty-point swing at the top of the board came out of one game between two entrants who own both sides of it.\"\n  ],\n\n  games: [\n    { text: \"The season opened on a Wednesday, which nobody asked for, and it opened with the ugliest kind of pool head-to-head — Adrian's Patriots losing a game they had every chance to win. Nothing happened in the first half at all. Then Seattle got a field goal, New England answered with one, and the fourth quarter turned into a ten-point Seahawks run that Adrian never got back.\\n\\nDrake Maye's line tells the whole story and none of it: 178 yards, one touchdown, three interceptions. Three giveaways and he still only lost by three, which says something about how little Seattle actually had to do — Drew Lock threw for 187 and a score and was never asked to be more than adequate. Jaxon Smith-Njigba was the difference with eight catches for 122 and the touchdown that mattered, and the Seattle run game, such as it was, came from Jadarian Price at ten carries for 52.\\n\\nSo Orest banks the first win of the pool and the first head-to-head point off a rival. Adrian banks the first excuse, and it is a decent one — three picks and a three-point loss is a game he wins nine times in ten. He will remind us of that repeatedly.\",\n      winKey:\"SEA\", winScore:13, loseKey:\"NE\", loseScore:10 },\n    { text: \"Thursday was less competitive and considerably more instructive. Ben's 49ers walked into Los Angeles, scored in every quarter, and were never once troubled by Tymko's Rams. Three points in the first, seven in the second, seven in the third and ten in the fourth — that is a team executing a plan rather than surviving a game.\\n\\nBrock Purdy threw three touchdowns on 205 yards, which is the sort of quiet efficiency that wins four-month pools while nobody is looking. Christian McCaffrey took ten carries for 68 and never had to do more. On the other side Matthew Stafford managed 155 and an interception, Blake Corum got 54 on the ground, and Puka Nacua's five for 74 was the only Rams production worth the ticket price.\\n\\nThe pool consequence is bigger than the football one. Ben leaves Thursday night on plus twenty and Tymko on minus twenty, a forty-point gap in the net-points tiebreaker created in a single evening by two teams the same two men happen to own. Tymko has seventeen weeks to dig out of that, and it starts against Jordy's Broncos on Monday night.\",\n      winKey:\"SF\", winScore:27, loseKey:\"LAR\", loseScore:7 }\n  ],\n\n  entrants: [\n    { name: \"Ben\", result: \"1–0\", tone: \"good\", text: \"Best week in the pool and he did it on a Thursday. His Texans host Chris's Bills on Sunday, so there is every chance he is two head-to-heads to the good by Monday.\" },\n    { name: \"Orest\", result: \"1–0\", tone: \"good\", text: \"First win of the season and a head-to-head point off Adrian. His Ravens are in Indianapolis on Sunday, which should be comfortable enough.\" },\n    { name: \"Adrian\", result: \"0–1\", tone: \"bad\", text: \"Lost the opener by three with a quarterback having a nightmare. His Bucs are in Cincinnati on Sunday and he will want that one.\" },\n    { name: \"Tymko\", result: \"0–1\", tone: \"bad\", text: \"Bottom of the board on minus twenty before most entrants have played a snap. His Chiefs host Jordy's Broncos on Monday night — that is the climb back.\" },\n    { name: \"Bill, Chris, Jordy, Matej, Taras\", result: \"idle\", tone: \"flat\", text: \"Five entrants dead level on nothing, which is the most honest position in the pool right now. All ten of their teams play between Sunday afternoon and Monday night.\" }\n  ],\n\n  ahead: [\n    \"Chris's Bills at Ben's Texans, Sunday 1:00 — the first proper head-to-head of the Sunday slate and one of them walks out a point poorer.\",\n    \"Jordy's Broncos at Tymko's Chiefs, Monday 8:15 — Tymko's chance to climb out of the hole Ben dug for him.\",\n    \"Seven entrants find out this weekend whether they drafted a contender or a rebuild.\"\n  ],\n\n  notes: [\n    { label: \"Biggest swing\", value: \"Ben +20 · Tymko −20\", sub: \"49ers at Rams did all of it\" },\n    { label: \"Quietest week\", value: \"5 entrants at 0\", sub: \"Bill, Chris, Jordy, Matej, Taras\" },\n    { label: \"Watch next\", value: \"BUF at HOU\", sub: \"Chris vs Ben, Sunday 1:00 ET\" }\n  ]\n};\n\nclass Component extends DCLogic {\n  state = { tab:\"standings\", me:\"\", savedName:\"\", booted:false, narrow:false, open:{},\n    loginName:\"\", loginError:\"\", draft:\"\", posts:POSTS_SEED };\n\n  stripRef = React.createRef();\n\n  // Park the score strip on the first live game once, so finished games sit behind it.\n  scrollStrip() {\n    const el = this.stripRef.current;\n    if (!el || this.stripScrolled) return;\n    const kid = el.children[this.stripStart || 0];\n    if (!kid) return;\n    this.stripScrolled = true;\n    el.scrollLeft = Math.max(0, kid.offsetLeft - el.offsetLeft);\n  }\n\n  componentDidUpdate() { requestAnimationFrame(() => this.scrollStrip()); }\n\n  componentWillUnmount() {\n    if (this.onResize) window.removeEventListener(\"resize\", this.onResize);\n    if (this.liveTimer) clearInterval(this.liveTimer);\n  }\n\n  // Polls ESPN directly from the visitor's browser while any pool game is in\n  // progress. Costs nothing — no commits, no builds, no scheduler lag. Only\n  // runs while someone has the page open, and stops once every game is final.\n  startLivePolling() {\n    if (this.liveTimer) clearInterval(this.liveTimer);\n    this.liveTimer = setInterval(() => this.pollLive(), 30000);\n    this.pollLive();\n  }\n\n  async pollLive() {\n    if (document.hidden) return;              // don't poll a backgrounded tab\n    const anyPending = GAMES.some(g => !g.done);\n    if (!anyPending) { clearInterval(this.liveTimer); this.liveTimer = null; return; }\n\n    try {\n      const res = await fetch(\n        \"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard\",\n        { cache: \"no-store\" });\n      if (!res.ok) return;\n      const sb = await res.json();\n\n      const alias = { WAS:\"WSH\", OAK:\"LV\", SD:\"LAC\", STL:\"LAR\" };\n      const norm = a => alias[a] || a;\n      const byPair = {};\n      for (const ev of sb.events || []) {\n        const c = ev.competitions[0];\n        const away = c.competitors.find(x => x.homeAway === \"away\");\n        const home = c.competitors.find(x => x.homeAway === \"home\");\n        if (!away || !home) continue;\n        byPair[norm(away.team.abbreviation) + \"@\" + norm(home.team.abbreviation)] = {\n          as: Number(away.score), hs: Number(home.score),\n          state: c.status?.type?.state,\n          detail: c.status?.type?.shortDetail\n        };\n      }\n\n      let changed = false;\n      GAMES.forEach(g => {\n        const u = byPair[g.away + \"@\" + g.home];\n        if (!u || u.state === \"pre\") return;\n        const live = u.state === \"in\", done = u.state === \"post\";\n        if (g.as !== u.as || g.hs !== u.hs || g.done !== done || g.live !== live) changed = true;\n        g.as = u.as; g.hs = u.hs; g.live = live; g.done = done;\n        if (live) { g.clock = u.detail; g.when = g.when.split(\" · \")[0] + \" · \" + u.detail; }\n        if (done) g.when = g.when.split(\" · \")[0] + \" · Final\";\n      });\n\n      if (changed) {\n        this.setState({ polledAt: new Date().toLocaleTimeString(\"en-US\",\n          { hour:\"numeric\", minute:\"2-digit\" }) + \" ET\" });\n      }\n    } catch (e) { /* ESPN unreachable — the half-hourly feed still covers us */ }\n  }\n\n  componentDidMount() {\n    this.loadLive();\n    this.onResize = () => {\n      const narrow = window.innerWidth < 760;\n      if (narrow !== this.state.narrow) this.setState({ narrow });\n    };\n    this.onResize();\n    window.addEventListener(\"resize\", this.onResize);\n    this.startLivePolling();\n    let saved = null;\n    try { saved = JSON.parse(localStorage.getItem(\"nflpool.session\") || \"null\"); } catch (e) {}\n    const valid = saved && ENTRIES.some(x => x.name === saved.name);\n    this.setState({ booted:true, savedName: valid ? saved.name : \"\", loginName: valid ? saved.name : \"\" });\n  }\n\n  // Reads the season feed straight from GitHub so a data update needs no redeploy,\n  // falling back to the deployed copy, then to the bundled sample data.\n  async loadLive() {\n    const sources = [\n      \"https://raw.githubusercontent.com/Tymko-A/nfl-pool/main/data/season.json\",\n      \"data/season.json\"\n    ];\n    let d = null;\n    for (const url of sources) {\n      try {\n        const res = await fetch(url, { cache: \"no-store\" });\n        if (!res.ok) continue;\n        d = await res.json();\n        break;\n      } catch (e) { /* try the next source */ }\n    }\n    if (d) {\n      if (d.teams) TEAMS = d.teams;\n      if (d.entries) { ENTRIES = d.entries; rebuildOwner(); }\n      if (d.games) { GAMES = d.games; this.stripScrolled = false; }\n      if (d.results) RESULTS = d.results;\n      if (d.recap) RECAP = d.recap;\n      this.setState({ liveWeek: d.week, liveUpdated: d.updated, live: true });\n    }\n  }\n\n  quickEnter = () => this.setState({ me: this.state.savedName });\n\n  forgetMe = () => {\n    try { localStorage.setItem(\"nflpool.session\", \"null\"); } catch (e) {}\n    this.setState({ savedName:\"\", loginName:\"\", loginError:\"\" });\n  };\n\n  dot(key, size) {\n    const c = TEAMS[key] ? TEAMS[key].color : \"#cfc7bd\";\n    const s = size || 9;\n    return \"width:\" + s + \"px;height:\" + s + \"px;border-radius:999px;flex:none;display:block;background:\" + c;\n  }\n\n  badge(rank, top) {\n    const base = \"width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:Archivo,sans-serif;font-weight:800;font-size:13px;flex:none;\";\n    if (top === 1) return base + \"background:#b8491f;color:#fff\";\n    if (top <= 3) return base + \"background:#fdeee6;color:#9c3f13\";\n    return base + \"background:#f4f2ee;color:#6f6860\";\n  }\n\n  standingsData() {\n    const rows = ENTRIES.map(e => {\n      const a = TEAMS[e.afc], n = TEAMS[e.nfc];\n      const w = a.w + n.w, l = a.l + n.l, t = a.t + n.t;\n      const pf = a.pf + n.pf, pa = a.pa + n.pa;\n      return { name:e.name, afcKey:e.afc, nfcKey:e.nfc, a, n, w, l, t, pf, pa,\n        pts: w + t * 0.5, net: pf - pa, gp: w + l + t };\n    });\n    rows.sort((x, y) => y.pts - x.pts || y.net - x.net || y.pf - x.pf || x.name.localeCompare(y.name));\n    const key = r => r.pts + \"|\" + r.net + \"|\" + r.pf;\n    rows.forEach(r => {\n      const ahead = rows.filter(o => key(o) !== key(r) &&\n        (o.pts > r.pts || (o.pts === r.pts && (o.net > r.net || (o.net === r.net && o.pf > r.pf))))).length;\n      r.rank = ahead + 1;\n      r.shared = rows.filter(o => key(o) === key(r)).length > 1;\n    });\n    return rows;\n  }\n\n  fmt(v) { return v > 0 ? \"+\" + v : String(v); }\n  pts(v) { return Number.isInteger(v) ? String(v) : v.toFixed(1); }\n  pct(won, gp) {\n    if (!gp) return \"—\";\n    const s = (won / gp).toFixed(3);\n    return s.charAt(0) === \"0\" ? s.slice(1) : s;\n  }\n  rec(t) { return t.w + \"-\" + t.l + (t.t ? \"-\" + t.t : \"\"); }\n\n  teamBlock(key) {\n    const t = TEAMS[key];\n    const gp = t.w + t.l + t.t;\n    return { conf:t.conf, name:t.name, rec:this.rec(t), dot:this.dot(key, 10),\n      pf:t.pf, pa:t.pa, net:this.fmt(t.pf - t.pa),\n      streak: gp ? \"Pct \" + this.pct(t.w + t.t * 0.5, gp) : \"Not yet played\" };\n  }\n\n  cellStyle(mark) {\n    const base = \"height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;\";\n    if (mark === \"W\") return base + \"background:#2f7a52;color:#fff\";\n    if (mark === \"L\") return base + \"background:#e0dbd3;color:#7b736b\";\n    if (mark === \"T\") return base + \"background:#f0b429;color:#4a3608\";\n    if (mark === \"B\") return base + \"background:#f4f2ee;color:#726b63\";\n    if (mark === \"·\") return base + \"border:1.5px dashed #cfc7bd\";\n    return base + \"background:#faf9f7\";\n  }\n\n  streak(key, kind) {\n    const played = (RESULTS[key] || []).filter(m => m === \"W\" || m === \"L\" || m === \"T\");\n    let n = 0;\n    for (let i = played.length - 1; i >= 0; i--) {\n      if (played[i] === kind) n++; else break;\n    }\n    return n;\n  }\n\n  scorecardData(S, me) {\n    const keys = Object.keys(TEAMS);\n    const playedKeys = keys.filter(k => TEAMS[k].w + TEAMS[k].l + TEAMS[k].t > 0);\n    const best = (arr, score) => arr.length\n      ? arr.slice().sort((a, b) => score(b) - score(a))[0]\n      : null;\n\n    const netEntrant = S.slice().sort((a, b) => b.net - a.net)[0];\n    const netTeam = best(playedKeys, k => TEAMS[k].pf - TEAMS[k].pa);\n    const scored = best(playedKeys, k => TEAMS[k].pf);\n    const allowed = best(playedKeys, k => -TEAMS[k].pa);\n    const hot = best(keys.filter(k => this.streak(k, \"W\") > 0), k => this.streak(k, \"W\") * 1000 + (TEAMS[k].pf - TEAMS[k].pa));\n    const cold = best(keys.filter(k => this.streak(k, \"L\") > 0), k => this.streak(k, \"L\") * 1000 - (TEAMS[k].pf - TEAMS[k].pa));\n\n    const base = \"background:#fff;border-radius:14px;padding:15px 16px;box-shadow:0 1px 2px rgba(27,26,24,0.05)\";\n    const mineStyle = \"background:#dcebe1;border-radius:14px;padding:15px 16px;box-shadow:0 1px 2px rgba(27,26,24,0.05);outline:1px solid #9cc7a9;outline-offset:-1px\";\n    const tile = (label, who, value, sub, dotKey) => {\n      // A card is \"mine\" when it names me, or names a team I hold.\n      const mine = me && (who === me || (dotKey && OWNER[dotKey] === me));\n      return {\n        label, who: who || \"—\", value: value == null ? \"—\" : String(value), sub,\n        dot: dotKey ? this.dot(dotKey, 10) : \"display:none\",\n        cardStyle: mine ? mineStyle : base\n      };\n    };\n\n    return [\n      tile(\"Net points\", netEntrant ? netEntrant.name : null,\n        netEntrant ? this.fmt(netEntrant.net) : null, \"Entrant · both teams combined\", null),\n      tile(\"Net differential\", netTeam ? TEAMS[netTeam].name : null,\n        netTeam ? this.fmt(TEAMS[netTeam].pf - TEAMS[netTeam].pa) : null, \"Best single team\", netTeam),\n      tile(\"Most scored\", scored ? TEAMS[scored].name : null,\n        scored ? TEAMS[scored].pf : null, \"Total points for\", scored),\n      tile(\"Fewest allowed\", allowed ? TEAMS[allowed].name : null,\n        allowed ? TEAMS[allowed].pa : null, \"Total points against\", allowed),\n      tile(\"Hot streak\", hot ? TEAMS[hot].name : null,\n        hot ? this.streak(hot, \"W\") + (this.streak(hot, \"W\") === 1 ? \" win\" : \" wins\") : null,\n        \"Consecutive wins\", hot),\n      tile(\"Cold streak\", cold ? TEAMS[cold].name : null,\n        cold ? this.streak(cold, \"L\") + (this.streak(cold, \"L\") === 1 ? \" loss\" : \" losses\") : null,\n        \"Consecutive losses\", cold)\n    ];\n  }\n\n  scheduleData(me) {\n    const mine = {};\n    ENTRIES.forEach(e => { if (e.name === me) { mine[e.afc] = true; mine[e.nfc] = true; } });\n    const own = k => OWNER[k] ? \"(\" + OWNER[k] + \")\" : \"\";\n    const groups = [];\n    GAMES.forEach(g => {\n      const parts = g.when.split(\" · \");\n      const label = parts[0], slot = parts[1] || \"\";\n      const last = groups[groups.length - 1];\n      const row = {\n        away: g.away, home: g.home,\n        awayName: this.teamName(g.away), homeName: this.teamName(g.home),\n        awayOwner: own(g.away), homeOwner: own(g.home),\n        awayDot: this.dot(g.away, 10), homeDot: this.dot(g.home, 10),\n        result: (g.done || g.live) ? g.as + \"–\" + g.hs : \"\",\n        status: g.done ? \"Final\" : g.live ? (g.clock || \"Live\") : \"\",\n        liveStyle: g.live\n          ? \"font-size:9.5px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;background:#1f5c3c;color:#fff;border-radius:6px;padding:3px 7px;flex:none\"\n          : \"display:none\",\n        isMine: !!(mine[g.away] || mine[g.home]),\n        rowStyle: (mine[g.away] || mine[g.home])\n          ? \"display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid #f1ede7;flex-wrap:wrap;background:#fef7f3\"\n          : \"display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid #f1ede7;flex-wrap:wrap\",\n        stakeStyle: (OWNER[g.away] && OWNER[g.home])\n          ? \"font-size:9.5px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;background:#b8491f;color:#fff;border-radius:6px;padding:3px 7px;flex:none\"\n          : \"display:none\",\n        stake: \"Head-to-Head\"\n      };\n      if (last && last.label === label && last.slot === slot) last.rows.push(row);\n      else groups.push({ label, slot, done: g.done, rows: [row] });\n    });\n    return groups;\n  }\n\n  myNext(me) {\n    const rows = [];\n    ENTRIES.filter(e => e.name === me).forEach(e => {\n      [e.afc, e.nfc].forEach(k => {\n        const g = GAMES.find(x => x.away === k || x.home === k);\n        if (!g) return;\n        const away = g.away === k;\n        rows.push({\n          team: TEAMS[k].name, dot: this.dot(k, 11), conf: TEAMS[k].conf,\n          vs: (away ? \"at \" : \"vs \") + this.teamName(away ? g.home : g.away),\n          opponentOwner: OWNER[away ? g.home : g.away] ? \"(\" + OWNER[away ? g.home : g.away] + \")\" : \"\",\n          when: g.done ? \"Final · \" + (away ? g.as + \"–\" + g.hs : g.hs + \"–\" + g.as) : g.when\n        });\n      });\n    });\n    return rows;\n  }\n\n  weeklyRace() {\n    const tally = {};\n    ENTRIES.forEach(e => { tally[e.name] = { name:e.name, wins:0, ties:0, net:0, played:0 }; });\n    GAMES.filter(g => g.done).forEach(g => {\n      [[g.away, g.as, g.hs], [g.home, g.hs, g.as]].forEach(([k, own, opp]) => {\n        const o = OWNER[k];\n        if (!o) return;\n        const t = tally[o];\n        t.played++;\n        t.net += own - opp;\n        if (own > opp) t.wins++; else if (own === opp) t.ties++;\n      });\n    });\n    const rows = Object.keys(tally).map(k => tally[k]);\n    rows.sort((a, b) =>\n      (b.wins + b.ties * 0.5) - (a.wins + a.ties * 0.5) || b.net - a.net || a.name.localeCompare(b.name));\n    return rows;\n  }\n\n  teamName(k) { return TEAMS[k] ? TEAMS[k].name : (OUTSIDE[k] || k); }\n  teamRec(k) { return TEAMS[k] ? this.rec(TEAMS[k]) : \"not in pool\"; }\n\n  gridData(S) {\n    const scheduled = {};\n    GAMES.forEach(g => { if (!g.done) { scheduled[g.away] = true; scheduled[g.home] = true; } });\n    const rows = [];\n    S.forEach(r => {\n      [r.afcKey, r.nfcKey].forEach(k => {\n        const t = TEAMS[k];\n        const played = RESULTS[k] || [];\n        const marks = [];\n        for (let i = 0; i < 18; i++) marks.push(played[i] || (i === 0 && scheduled[k] ? \"·\" : \"\"));\n        rows.push({ owner:r.name, team:t.name, rec:this.rec(t), dot:this.dot(k, 10),\n          cells: marks.map(m => ({ mark: m === \"·\" ? \"\" : m, style:this.cellStyle(m) })) });\n      });\n    });\n    return rows;\n  }\n\n  ledgerData() {\n    const map = {};\n    GAMES.filter(g => OWNER[g.away] && OWNER[g.home]).forEach(g => {\n      const ao = OWNER[g.away], ho = OWNER[g.home];\n      const pair = [ao, ho].sort();\n      const id = pair.join(\" vs \");\n      if (!map[id]) map[id] = { first:pair[0], games:0, wins:{}, swing:0, upcoming:[] };\n      const e = map[id];\n      if (g.done) {\n        e.games++;\n        const winner = g.as > g.hs ? ao : ho;\n        e.wins[winner] = (e.wins[winner] || 0) + 1;\n        const margin = Math.abs(g.as - g.hs);\n        e.swing += (winner === e.first ? margin : -margin);\n      } else {\n        e.upcoming.push(g.when.split(\" · \")[0] + \" · \" + g.away + \" at \" + g.home);\n      }\n    });\n    return Object.keys(map).sort().map(id => {\n      const e = map[id];\n      const names = id.split(\" vs \");\n      const a = e.wins[names[0]] || 0, b = e.wins[names[1]] || 0;\n      const other = names[0] === e.first ? names[1] : names[0];\n      return {\n        pair: id,\n        games: e.games,\n        record: e.games === 0 ? \"—\" : (a === b ? a + \"–\" + b : Math.max(a, b) + \"–\" + Math.min(a, b) + \" \" + (a > b ? names[0] : names[1])),\n        swing: e.games === 0 ? \"—\" : (e.swing > 0 ? \"+\" + e.swing + \" \" + e.first : (e.swing < 0 ? \"+\" + Math.abs(e.swing) + \" \" + other : \"level\")),\n        next: e.upcoming.length ? e.upcoming[0] : \"none scheduled yet\"\n      };\n    });\n  }\n\n  login() {\n    const name = this.state.loginName;\n    if (!name) return this.setState({ loginError:\"Pick your name from the list.\" });\n    try { localStorage.setItem(\"nflpool.session\", JSON.stringify({ name })); } catch (e) {}\n    this.setState({ me:name, savedName:name, loginError:\"\" });\n  }\n\n  signOut = () => {\n    this.setState({ me:\"\", loginError:\"\", tab:\"standings\" });\n  };\n\n  exportCsv = () => {\n    const head = [\"Rank\",\"Entrant\",\"AFC Team\",\"NFC Team\",\"W\",\"L\",\"T\",\"Points\",\"Pct\",\"PF\",\"PA\",\"Net\"];\n    const lines = [head.join(\",\")].concat(this.standingsData().map(r => [\n      r.rank, r.name, r.a.name, r.n.name, r.w, r.l, r.t, this.pts(r.pts),\n      r.gp ? (r.pts / r.gp).toFixed(3) : \"\", r.pf, r.pa, r.net\n    ].join(\",\")));\n    const url = URL.createObjectURL(new Blob([lines.join(\"\\n\")], {type:\"text/csv\"}));\n    const a = document.createElement(\"a\");\n    a.href = url; a.download = \"pool-standings-2026-week1.csv\"; a.click();\n    URL.revokeObjectURL(url);\n  };\n\n  renderVals() {\n    const S = this.standingsData();\n    const byName = {}; S.forEach(r => { byName[r.name] = r; });\n    const me = this.state.me;\n\n    const tabBase = \"height:34px;padding:0 15px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;flex:none;border:1px solid \";\n    // \"talk\" is intentionally not listed — the panel stays in the file for later reuse.\n    const tabs = [[\"standings\",\"Standings\"],[\"recap\",\"Recap\"],[\"schedule\",\"Schedule\"],[\"rosters\",\"Rosters\"],[\"week\",\"This week\"],[\"grid\",\"Week by week\"],[\"h2h\",\"Head-to-Head\"],[\"side\",\"Side pools\"],[\"rules\",\"Rules\"]]\n      .map(([k, label]) => ({\n        label,\n        style: this.state.tab === k\n          ? tabBase + \"#1b1a18;background:#1b1a18;color:#fff\"\n          : tabBase + \"#e6e2db;background:#fff;color:#56504a\",\n        go: () => {\n          this.setState({ tab: k });\n          try {\n            window.scrollTo(0, 0);\n            if (document.scrollingElement) document.scrollingElement.scrollTop = 0;\n          } catch (e) {}\n        }\n      }));\n\n    const label = k => OWNER[k] ? k + \" (\" + OWNER[k] + \")\" : k;\n\n    const owned = k => OWNER[k] ? \"(\" + OWNER[k] + \")\" : \"\";\n\n    // My two teams, so their score cards can be shaded and floated to the front of their slot.\n    const myTeams = {};\n    ENTRIES.forEach(e => { if (e.name === me) { myTeams[e.afc] = true; myTeams[e.nfc] = true; } });\n    const isMine = g => !!(myTeams[g.away] || myTeams[g.home]);\n\n    // Keep kickoff slots in feed order, but put my games first inside each slot.\n    // Live games carry a running clock in `when`, so bucket them by day + \"live\"\n    // instead of the display string — otherwise each one is its own slot.\n    const slotKey = g => {\n      const day = g.when.split(\" · \")[0];\n      if (g.live && !g.done) return day + \" · live\";\n      return g.when;\n    };\n    const slotOrder = [], bySlot = {};\n    GAMES.forEach(g => {\n      const k = slotKey(g);\n      if (!bySlot[k]) { bySlot[k] = []; slotOrder.push(k); }\n      bySlot[k].push(g);\n    });\n    const ordered = [];\n    slotOrder.forEach(s => {\n      ordered.push(...bySlot[s].filter(isMine), ...bySlot[s].filter(g => !isMine(g)));\n    });\n\n    // Where the strip should sit on load: first live game, else first game still to play.\n    let start = ordered.findIndex(g => g.live);\n    if (start < 0) start = ordered.findIndex(g => !g.done);\n    this.stripStart = start < 0 ? 0 : start;\n\n    const stripBase = \"flex:none;min-width:158px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(27,26,24,0.05)\";\n    const stripMine = \"flex:none;min-width:158px;background:#dcebe1;border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(27,26,24,0.05);outline:1px solid #9cc7a9;outline-offset:-1px\";\n\n    const strip = ordered.map(g => ({\n      kicker: g.when,\n      away: g.away, home: g.home,\n      awayOwner: owned(g.away), homeOwner: owned(g.home),\n      awayScore: (g.done || g.live) ? g.as : \"—\",\n      homeScore: (g.done || g.live) ? g.hs : \"—\",\n      awayDot: this.dot(g.away, 8),\n      homeDot: this.dot(g.home, 8),\n      cardStyle: isMine(g) ? stripMine : stripBase\n    }));\n\n    const slim = GAMES.filter(g => !g.done && !g.live).map(g => {\n      const collision = OWNER[g.away] && OWNER[g.home];\n      return {\n        time: g.when.split(\" · \")[1],\n        day: g.when.split(\" · \")[0],\n        away: label(g.away), home: label(g.home),\n        awayDot: this.dot(g.away, 9), homeDot: this.dot(g.home, 9),\n        stake: collision ? \"Head-to-Head\" : \"\",\n        stakeStyle: collision\n          ? \"font-size:9.5px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;background:#b8491f;color:#fff;border-radius:6px;padding:3px 7px;flex:none\"\n          : \"display:none\"\n      };\n    });\n\n    const games = GAMES.map((g, i) => {\n      const ao = OWNER[g.away], ho = OWNER[g.home];\n      const collision = ao && ho;\n      return {\n        slot: g.when,\n        stake: collision ? \"Head-to-Head\" : \"1 pool team\",\n        stakeStyle: collision\n          ? \"margin-left:auto;font-size:10px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;background:#b8491f;color:#fff;border-radius:6px;padding:3px 8px\"\n          : \"margin-left:auto;font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;background:#f4f2ee;color:#6f6860;border-radius:6px;padding:3px 8px\",\n        open: !!this.state.open[i],\n        hasDetail: g.done || g.live,\n        toggleLabel: this.state.open[i] ? \"Hide leaders\" : \"Game leaders\",\n        toggle: () => this.setState(s => ({ open: Object.assign({}, s.open, { [i]: !s.open[i] }) })),\n        sides: [\n          { team: this.teamName(g.away), owner: ao || \"unowned\", rec: this.teamRec(g.away),\n            score: g.done ? g.as : \"—\", dot: this.dot(g.away, 11) },\n          { team: this.teamName(g.home), owner: ho || \"unowned\", rec: this.teamRec(g.home),\n            score: g.done ? g.hs : \"—\", dot: this.dot(g.home, 11) }\n        ],\n        leaders: g.leaders.map(p => ({ cat:p[0], who:p[1], stat:p[2] }))\n      };\n    });\n\n    const collisions = GAMES.filter(g => OWNER[g.away] && OWNER[g.home]).map(g => ({\n      a: OWNER[g.away], aTeam: g.away, aDot: this.dot(g.away, 9),\n      b: OWNER[g.home], bTeam: g.home, bDot: this.dot(g.home, 9),\n      mid: g.done ? g.as + \"–\" + g.hs : \"vs\",\n      status: g.done\n        ? (g.as > g.hs ? OWNER[g.away] + \" took the point\" : OWNER[g.home] + \" took the point\")\n        : g.when + \" · one of them loses a point\"\n    }));\n\n    const initial = n => (n ? n.charAt(0).toUpperCase() : \"?\");\n\n    return {\n      week: this.state.liveWeek || 1,\n      updated: this.state.polledAt || this.state.liveUpdated || \"Sept 11, 9:00 AM ET\",\n      names: ENTRIES.map(e => e.name),\n      me, meInitial: initial(me),\n      tabs, strip, slim, stripRef: this.stripRef,\n      finals: games.filter((g, i) => GAMES[i].done || GAMES[i].live),\n      upcomingCount: slim.length,\n      weekNums: Array.from({length:18}, (_, i) => i + 1),\n      isStandings: this.state.tab === \"standings\",\n      isNarrow: this.state.narrow,\n      isWide: !this.state.narrow,\n      isRosters: this.state.tab === \"rosters\",\n      isWeek: this.state.tab === \"week\",\n      isGrid: this.state.tab === \"grid\",\n      isH2H: this.state.tab === \"h2h\",\n      isTalk: this.state.tab === \"talk\",\n      isRecap: this.state.tab === \"recap\",\n      isSchedule: this.state.tab === \"schedule\",\n      schedule: this.scheduleData(me),\n      myNext: this.myNext(me),\n      recap: Object.assign({}, RECAP, {\n        games: RECAP.games.map(g => Object.assign({}, g, {\n          winTeam: this.teamName(g.winKey),\n          loseTeam: this.teamName(g.loseKey),\n          winOwner: OWNER[g.winKey] ? \"(\" + OWNER[g.winKey] + \")\" : \"\",\n          loseOwner: OWNER[g.loseKey] ? \"(\" + OWNER[g.loseKey] + \")\" : \"\",\n          winDot: this.dot(g.winKey, 10),\n          loseDot: this.dot(g.loseKey, 10)\n        })),\n        entrants: RECAP.entrants.map(e => {\n          const chip = \"font-size:10.5px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;border-radius:6px;padding:3px 8px;\";\n          return Object.assign({}, e, {\n            chipStyle: e.tone === \"good\" ? chip + \"background:#e4f0e9;color:#1f5c3c\"\n              : e.tone === \"bad\" ? chip + \"background:#fdeee6;color:#9c3f13\"\n              : chip + \"background:#f4f2ee;color:#6f6860\"\n          });\n        })\n      }),\n      isSide: this.state.tab === \"side\",\n      isRules: this.state.tab === \"rules\",\n      rules: RULES,\n      sidePools: SIDE.map((s, i) => {\n        if (i !== 0) return s;\n        const race = this.weeklyRace();\n        const groups = [];\n        race.forEach(r => {\n          const pts = r.wins + r.ties * 0.5;\n          const last = groups[groups.length - 1];\n          if (last && last.pts === pts && last.net === r.net) last.names.push(r.name);\n          else groups.push({ pts, net:r.net, wins:r.wins, ties:r.ties, names:[r.name] });\n        });\n        return Object.assign({}, s, {\n          rows: groups.slice(0, 3).map(g => ({\n            who: g.names.length > 3\n              ? g.names.length + \" entrants level\"\n              : g.names.join(\", \"),\n            val: g.pts + (g.pts === 1 ? \" win\" : \" wins\") + \" · \" + this.fmt(g.net)\n          }))\n        });\n      }).map((s, i) => {\n        if (i !== 1) return s;\n        const byNet = S.slice().sort((a, b) => b.net - a.net || b.pf - a.pf);\n        return Object.assign({}, s, {\n          rows: byNet.slice(0, 3).map(r => ({ who: r.name, val: this.fmt(r.net) }))\n        });\n      }),\n      games, collisions,\n      scorecard: this.scorecardData(S, me),\n      gridRows: this.gridData(S),\n      ledger: this.ledgerData(),\n\n      podium: S.slice(0, 3).map(r => ({\n        rank: (r.shared ? \"T\" : \"\") + r.rank,\n        rankLabel: (r.shared ? \"Tied for \" : \"\") + ([\"first\",\"second\",\"third\"][r.rank - 1] || \"rank \" + r.rank),\n        badgeStyle: this.badge(r.rank, r.rank),\n        cardStyle: r.name === me\n          ? CARD + \";outline:2px solid #b8491f;outline-offset:-2px\"\n          : CARD,\n        name: r.name,\n        afc: r.a.name, afcRec: this.rec(r.a), afcDot: this.dot(r.afcKey, 10),\n        nfc: r.n.name, nfcRec: this.rec(r.n), nfcDot: this.dot(r.nfcKey, 10),\n        pts: this.pts(r.pts), rec: r.w + \"-\" + r.l + \"-\" + r.t, net: this.fmt(r.net)\n      })),\n\n      standings: S.map(r => ({\n        rank: (r.shared ? \"T\" : \"\") + r.rank,\n        badgeStyle: this.badge(r.rank, r.rank),\n        name: r.name, isMe: r.name === me,\n        afc: r.a.name, nfc: r.n.name,\n        afcDot: this.dot(r.afcKey, 8), nfcDot: this.dot(r.nfcKey, 8),\n        afcRec: this.rec(r.a), nfcRec: this.rec(r.n),\n        w: r.w, l: r.l, t: r.t, pts: this.pts(r.pts),\n        recFull: r.w + \"-\" + r.l + \"-\" + r.t,\n        pct: this.pct(r.pts, r.gp), pf: r.pf, pa: r.pa, net: this.fmt(r.net),\n        rowStyle: r.name === me ? \"background:#fef7f3\" : \"\",\n        mobileCardStyle: \"background:#fff;border-radius:14px;padding:15px 16px;box-shadow:0 1px 2px rgba(27,26,24,0.05)\"\n          + (r.name === me ? \";outline:2px solid #b8491f;outline-offset:-2px\" : \"\")\n      })),\n\n      rosters: S.map(r => ({\n        name: r.name,\n        rank: (r.shared ? \"T\" : \"\") + r.rank,\n        badgeStyle: this.badge(r.rank, r.rank),\n        cardStyle: r.name === me ? CARD + \";outline:2px solid #b8491f;outline-offset:-2px\" : CARD,\n        pts: this.pts(r.pts),\n        teams: [this.teamBlock(r.afcKey), this.teamBlock(r.nfcKey)]\n      })),\n\n      posts: this.state.posts.map(p => ({\n        who: p.who, text: p.text, when: p.when,\n        initial: initial(p.who),\n        avatarStyle: \"width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;\"\n          + (p.who === me ? \"background:#2f7a52;color:#fff\" : \"background:#e8e3db;color:#56504a\"),\n        rank: byName[p.who] ? \"Rank \" + (byName[p.who].shared ? \"T\" : \"\") + byName[p.who].rank : \"guest\"\n      })),\n      draft: this.state.draft,\n      onDraft: e => this.setState({ draft: e.target.value }),\n      post: () => {\n        const text = this.state.draft.trim();\n        if (!text) return;\n        this.setState(s => ({ draft:\"\", posts: [{ who: s.me || \"Anonymous\", text, when:\"just now\" }].concat(s.posts) }));\n      },\n\n      authed: this.state.booted && !!this.state.me,\n      showLogin: this.state.booted && !this.state.me,\n      showGate: this.state.booted && !this.state.me && !this.state.savedName,\n      showQuick: this.state.booted && !this.state.me && !!this.state.savedName,\n      savedName: this.state.savedName,\n      savedInitial: initial(this.state.savedName),\n      quickEnter: this.quickEnter,\n      forgetMe: this.forgetMe,\n      loginName: this.state.loginName,\n      loginError: this.state.loginError,\n      onLoginName: e => this.setState({ loginName: e.target.value, loginError:\"\" }),\n      doLogin: () => this.login(),\n      signOut: this.signOut,\n      exportCsv: this.exportCsv\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
