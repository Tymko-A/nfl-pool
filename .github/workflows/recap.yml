name: Write weekly recap

on:
  schedule:
    # Tuesday 6:00am ET (10:00 UTC) — after Monday Night Football is settled
    - cron: "0 10 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nfl-recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh data first
        run: node scripts/fetch.mjs

      - name: Write the recap
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/recap.mjs

      - name: Commit
        run: |
          git config user.name  "pool-bot"
          git config user.email "pool-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No change" && exit 0
          git commit -m "Weekly recap $(date -u +'%Y-%m-%d')"
          git push
