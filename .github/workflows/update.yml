name: Update NFL data

on:
  schedule:
    # 5:00am ET daily (09:00 UTC) — the baseline refresh
    - cron: "0 9 * * *"
    # Sunday 1pm ET through Monday 1am ET, every 30 minutes — live-ish scores
    - cron: "*/30 17-23 * * 0"
    - cron: "*/30 0-5 * * 1"
    # Monday night football, every 30 minutes
    - cron: "*/30 0-5 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nfl-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch season data
        run: node scripts/fetch.mjs

      - name: Commit if changed
        run: |
          git config user.name  "pool-bot"
          git config user.email "pool-bot@users.noreply.github.com"
          git add data/season.json
          git diff --staged --quiet && echo "No change" && exit 0
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
